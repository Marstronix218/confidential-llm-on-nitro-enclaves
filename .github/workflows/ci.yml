name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            common/requirements-dev.txt
            control-plane/api/requirements.txt
            data-plane/requirements.txt
      # No torch/transformers: tests/conftest.py stubs `transformers` before importing the enclave server.
      # pycryptodome and cbor2 are the enclave's remaining runtime deps (same pins as enclave/requirements.in).
      - name: Install dependencies
        run: >-
          pip install
          -r common/requirements-dev.txt
          -r control-plane/api/requirements.txt
          -r data-plane/requirements.txt
          pycryptodome==4.1.0 cbor2==6.1.5
      - name: pytest
        run: python -m pytest -q

  web:
    name: Web lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: control-plane/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: control-plane/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run build

  compose-smoke:
    name: docker compose smoke test (distilgpt2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENCLAVE_MODEL: distilgpt2
      API_TOKEN: local-api-token
      # Distinctive text so the log checks below cannot match anything else
      PROMPT: "ci-smoke-${{ github.run_id }}: what is a trusted execution environment?"
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 1200
      - name: Smoke test (key exchange + one encrypted prompt)
        run: python3 scripts/smoke_test.py --prompt "$PROMPT"
      - name: The data plane never sees the prompt
        run: |
          # Positive control: the local enclave logs plaintext (ENCLAVE_LOG_PLAINTEXT=true in compose),
          # so the prompt must be there; otherwise the negative check below would prove nothing.
          docker compose logs --no-color enclave | grep -qF "$PROMPT"
          if docker compose logs --no-color data-plane | grep -F "$PROMPT"; then
            echo "::error::plaintext prompt found in the data-plane logs"
            exit 1
          fi
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
